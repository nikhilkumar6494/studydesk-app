<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07091F">
<title>StudyDesk</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3FF;--ink:#12163A;--acc:#6D5BFF;--coral:#FF5C8A;--mute:#6A7098;
  --panel:rgba(255,255,255,.66);--bub:rgba(255,255,255,.9);--bar:rgba(255,255,255,.6);--line:rgba(18,22,58,.09);
  --shadow:0 30px 80px rgba(60,50,160,.22);--grad:linear-gradient(135deg,#5B6CFF 0%,#9A5CFF 100%);
  --glow:0 8px 24px rgba(124,92,255,.4);--ab:.34;
}
[data-theme="dark"]{
  --bg:#07091F;--ink:#EDEFFF;--mute:#8E96CC;--panel:rgba(16,20,56,.62);--bub:rgba(34,41,98,.72);
  --bar:rgba(10,13,42,.6);--line:rgba(255,255,255,.09);--shadow:0 30px 80px rgba(0,0,0,.6);--ab:.5;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overflow:hidden}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
[hidden]{display:none!important}
button{font:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}
.i.sm{width:15px;height:15px}

/* Aurora background */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--ab);animation:drift 24s ease-in-out infinite alternate;will-change:transform}
.aurora i:nth-child(1){width:60vmax;height:60vmax;background:#5B6CFF;left:-18vmax;top:-24vmax}
.aurora i:nth-child(2){width:52vmax;height:52vmax;background:#FF5C8A;right:-20vmax;bottom:-22vmax;animation-delay:-9s;opacity:calc(var(--ab) - .1)}
.aurora i:nth-child(3){width:38vmax;height:38vmax;background:#22D3EE;left:38vw;top:42vh;animation-delay:-15s;opacity:calc(var(--ab) - .2)}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18) rotate(20deg)}}

/* Login */
.join{height:100%;display:grid;place-items:center;padding:20px;position:relative;overflow:auto}
#bg{position:absolute!important;inset:0;width:100%;height:100%;pointer-events:none}
.card{position:relative;width:min(94vw,420px);padding:30px 26px;border-radius:30px;background:var(--panel);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.card::after,.chat::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(154,92,255,.16),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover::after,.chat:hover::after{opacity:1}
.card .logo{width:56px;height:56px;border-radius:18px;margin-bottom:16px;cursor:default}
.card .logo .i{width:28px;height:28px}
.card h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.3rem;line-height:1;letter-spacing:-.035em;margin-bottom:10px;background:linear-gradient(100deg,var(--ink) 0%,#8F7BFF 45%,var(--coral) 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.card p.sub{color:var(--mute);margin-bottom:20px;line-height:1.45}
.card form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;background:var(--bub);border:1px solid var(--line);color:var(--mute);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(109,91,255,.22);color:var(--acc)}
.field input,.field textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.02rem;padding:14px 0;outline:0;resize:none}
.field.ta{align-items:flex-start}.field.ta .i{margin-top:15px}
.logo{flex:none;width:40px;height:40px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--glow);border:0;cursor:pointer;transition:transform .2s}
button.logo:hover{transform:rotate(-6deg) scale(1.06)}
dialog{border:1px solid var(--line);border-radius:26px;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--ink);padding:24px;width:min(92vw,340px);box-shadow:var(--shadow)}
dialog[open]{animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{background:rgba(4,6,26,.6);backdrop-filter:blur(6px)}
dialog h3{font-family:'Bricolage Grotesque',sans-serif;font-size:1.6rem;margin-bottom:8px}
dialog p{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px;color:var(--mute)}
dialog textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bub);color:var(--ink);resize:none;margin-bottom:10px}
dialog .link{color:var(--mute);display:block;margin-top:10px}
.av,.m .n{cursor:pointer}
.btn{position:relative;overflow:hidden;font-weight:700;background:var(--grad);color:#fff;border:0;border-radius:16px;padding:14px 22px;cursor:pointer;box-shadow:var(--glow);transition:transform .15s,box-shadow .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(124,92,255,.55)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.97)}
.btn.sm2{padding:9px 18px;border-radius:14px}
.link{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:6px 0;text-align:left}
.link:hover{text-decoration:underline}
#authErr{color:var(--coral);font-weight:700;min-height:1.4em;margin-top:10px}

/* Shell */
.chat{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;background:var(--panel);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
@media(min-width:800px){.chat{height:calc(100% - 32px);margin:16px auto;border-radius:32px;animation:rise .6s cubic-bezier(.2,.9,.3,1.2) both}}
@media(max-width:800px){.chat{border-left:0;border-right:0}}
.top{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bar);display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.top h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.025em;line-height:1.1}
.top small{color:var(--mute);display:flex;align-items:center;gap:6px;font-size:.78rem}
.live-dot{width:7px;height:7px;border-radius:50%;background:#2EE59D;box-shadow:0 0 0 0 rgba(46,229,157,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
.tools{display:flex;gap:6px}
.ic{display:grid;place-items:center;background:var(--bub);border:1px solid var(--line);color:var(--ink);border-radius:14px;width:38px;height:38px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.ic:hover{transform:translateY(-2px) scale(1.06);color:var(--acc)}
.ic:active{transform:scale(.9)}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;position:relative;z-index:1}
.day{align-self:center;margin:14px 0 6px;padding:4px 14px;border-radius:14px;background:var(--bub);border:1px solid var(--line);color:var(--mute);font-size:.76rem;font-weight:700;letter-spacing:.02em}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:9px}
.row.same{margin-top:0}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center;font-size:.95rem;box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.25);transition:transform .2s}
.av:hover{transform:scale(1.1)}
.av.ghost{visibility:hidden}
.m{max-width:80%;padding:9px 14px;border-radius:20px;background:var(--bub);border:1px solid var(--line);overflow-wrap:anywhere;box-shadow:0 4px 14px rgba(20,25,90,.08)}
.row:not(.same):not(.me) .m{border-top-left-radius:7px}
.row.me:not(.same) .m{border-top-right-radius:7px}
.row.me .m{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(124,92,255,.38)}
.m .n{font-weight:700;font-size:.8rem;margin-bottom:2px}
.tx{white-space:pre-wrap;line-height:1.4}
.m a{color:inherit;text-decoration:underline}
.m.big{background:transparent!important;border-color:transparent!important;box-shadow:none!important;font-size:2.6rem;line-height:1.15;padding:0 4px;color:var(--ink)!important}
.q{border-left:3px solid var(--coral);padding:3px 9px;margin-bottom:5px;font-size:.82rem;opacity:.95;cursor:pointer;background:rgba(127,127,160,.2);border-radius:8px}
.q b{display:block}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx:empty{display:none}
.chip{font-size:.8rem;padding:1px 9px;border-radius:12px;border:1px solid var(--line);background:var(--bub);color:var(--ink);cursor:pointer;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.chip.mine{background:var(--coral);color:#fff;border-color:var(--coral)}
.rpick{display:flex;gap:2px;margin-top:5px;background:var(--bub);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:3px 7px;width:max-content;animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
.rpick button{font-size:1.25rem;background:none;border:0;cursor:pointer;padding:2px 4px;transition:transform .15s}
.rpick button:hover{transform:scale(1.35) translateY(-3px)}
.t{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:9px;font-size:.7rem;opacity:.8;margin-top:3px}
.ab{background:none;border:0;color:inherit;cursor:pointer;padding:0;font-size:inherit;display:inline-flex;opacity:.65;transition:opacity .15s,transform .15s}
.ab:hover{opacity:1;transform:scale(1.2)}
.live .m{transform-origin:0 100%;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.live.me .m{transform-origin:100% 100%}
@keyframes pop{from{transform:scale(.7) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
#jump{position:absolute;right:16px;bottom:92px;z-index:2;display:flex;align-items:center;gap:6px;background:var(--coral);color:#fff;font-weight:700;border:0;border-radius:22px;padding:9px 15px;cursor:pointer;box-shadow:0 8px 22px rgba(255,92,138,.5);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.editor{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:200px}
.editor input{flex:1 1 140px;min-width:0;font:inherit;padding:7px 10px;border-radius:10px;border:0;color:#0B1033;background:#fff}
.editor button{font-weight:700;border:0;border-radius:10px;padding:7px 11px;cursor:pointer;background:var(--coral);color:#fff}

/* Input */
#rbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--line);background:var(--bar);font-size:.9rem;color:var(--mute);position:relative;z-index:1}
#rbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rbar .ab{opacity:1}
#emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:2px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bar);max-height:150px;overflow-y:auto;position:relative;z-index:1;animation:rise .25s ease both}
#emo button{font-size:1.5rem;background:transparent;border:0;cursor:pointer;border-radius:12px;padding:4px;transition:transform .15s,background .15s}
#emo button:hover{background:var(--bub);transform:scale(1.2)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bar);position:relative;z-index:1}
.bar input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:13px 18px;border:1px solid var(--line);border-radius:26px;background:var(--bub);color:var(--ink);transition:box-shadow .2s,border-color .2s}
.bar input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px rgba(109,91,255,.22)}
.bar .ic{border-radius:50%;width:46px;height:46px}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--grad);color:#fff;cursor:pointer;box-shadow:var(--glow);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.send:hover{transform:scale(1.1) rotate(-8deg);box-shadow:0 12px 30px rgba(124,92,255,.6)}
.send:active{transform:scale(.9)}
.send.fly .i{animation:fly .55s ease}
@keyframes fly{0%{transform:none}45%{transform:translate(28px,-28px);opacity:0}46%{transform:translate(-28px,28px);opacity:0}100%{transform:none;opacity:1}}

/* StudyDesk hub */
.tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bar);position:relative;z-index:1}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:14px;border:0;background:transparent;color:var(--mute);font-weight:700;cursor:pointer;transition:all .25s;font-size:.9rem}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
@media(max-width:430px){.tabs button span{display:none}}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;position:relative;z-index:1}
.pane{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:480px;margin:0 auto;animation:rise .4s ease both}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bub);color:var(--ink);font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.badge{padding:5px 12px;border-radius:14px;background:var(--bub);border:1px solid var(--line);font-size:.78rem;font-weight:700;color:var(--mute);white-space:nowrap}
.flist{display:flex;flex-direction:column;gap:10px;width:100%}
details.sn{width:100%;border-radius:20px;background:var(--bub);border:1px solid var(--line);padding:0 16px;transition:box-shadow .2s}
details.sn:hover{box-shadow:0 10px 26px rgba(60,50,160,.16)}
details.sn summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;font-weight:700}
details.sn summary::-webkit-details-marker{display:none}
details.sn summary .i{transition:transform .25s;color:var(--mute)}
details.sn[open] summary .i{transform:rotate(180deg)}
details.sn ul{padding:0 0 12px 18px;line-height:1.5;color:var(--ink)}
details.sn li{margin-bottom:6px}
.shead{width:100%;color:var(--mute);font-size:.82rem;text-align:center}

/* Games */
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
.gt{border:1px solid var(--line);border-radius:24px;padding:16px;background:var(--bub);cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.gt:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 16px 34px rgba(60,50,160,.25)}
.gt:active{transform:scale(.96)}
.gt .ge{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(135deg,hsl(var(--h) 85% 62% / .38),hsl(calc(var(--h) + 40) 85% 60% / .18))}
.gt b{font-size:1rem}.gt small{color:var(--mute);line-height:1.3}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ghead h3{font-family:'Bricolage Grotesque',sans-serif;font-size:1.3rem}
.gstage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ginfo{display:flex;gap:12px;font-weight:700;color:var(--mute);flex-wrap:wrap;justify-content:center;min-height:1.4em}
.ghint{color:var(--mute);font-size:.82rem;text-align:center}
.gcv{width:min(92vw,46vh,400px);aspect-ratio:1;border-radius:20px;border:1px solid var(--line);background:#0C1030;touch-action:none;box-shadow:0 14px 40px rgba(20,30,120,.35);cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px}
.pad button{border-radius:50%;border:1px solid var(--line);background:var(--bub);color:var(--ink);font-size:1.1rem;cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--acc);color:#fff}
.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,44vh,380px);aspect-ratio:1;padding:8px;border-radius:22px;background:var(--bub);border:1px solid var(--line);touch-action:none}
.c48{display:grid;place-items:center;border-radius:12px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1rem,5vw,1.7rem);color:#fff;background:var(--line);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.c48.nw{animation:pop .25s ease}
.gmem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,380px)}
.mc{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--grad);color:rgba(255,255,255,.7);font-size:1.8rem;font-weight:800;cursor:pointer;transition:transform .2s}
.mc.on{background:var(--bub);color:var(--ink);animation:flip .3s}
.mc.ok{opacity:.5;background:var(--bub)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.gttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,300px)}
.gttt button{aspect-ratio:1;border-radius:18px;border:1px solid var(--line);background:var(--bub);font-size:2.6rem;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;cursor:pointer;color:var(--acc)}
.gttt button.o{color:var(--coral)}
.gmole{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(86vw,320px)}
.hole{aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 50% 70%,#1a1230,#2c1e52);font-size:2.6rem;cursor:pointer;box-shadow:inset 0 -8px 16px rgba(0,0,0,.45)}
.hole.up{animation:pop .2s ease-out}
.gq{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.4rem;letter-spacing:-.02em;margin:6px 0}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(90vw,340px)}
.gopts button{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--bub);color:var(--ink);font-weight:800;font-size:1.25rem;cursor:pointer;transition:transform .12s}
.gopts button:active{transform:scale(.94)}
.gopts button.bad{background:var(--coral);color:#fff}

/* Focus + calc */
.ringwrap{position:relative;width:min(64vw,240px);aspect-ratio:1;filter:drop-shadow(0 10px 30px rgba(124,92,255,.35))}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .trk{stroke:var(--line);fill:none;stroke-width:10}
#fring{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;stroke-dasharray:552.92;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear}
.rtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#ftime{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:3rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#flabel{color:var(--mute);font-size:.85rem}
.ctl{display:flex;align-items:center;gap:14px}
.ctl .ic{width:48px;height:48px;border-radius:50%}
.ctl .send{width:64px;height:64px}
.ctl .send .i{width:26px;height:26px}
.disp{width:100%;padding:16px 18px;border-radius:22px;background:var(--bub);border:1px solid var(--line);text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#cexp{color:var(--mute);font-size:1.05rem;min-height:1.4em;overflow-wrap:anywhere}
#cres{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.3rem;letter-spacing:-.03em;min-height:1.2em;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.key{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bub);color:var(--ink);font-weight:700;font-size:1.02rem;cursor:pointer;transition:transform .12s,background .2s}
.key:hover{background:var(--panel)}
.key:active{transform:scale(.9)}
.key.op{color:var(--acc)}
.key.fn{font-size:.85rem;color:var(--mute)}
.key.eq{background:var(--grad);color:#fff;border:0;box-shadow:var(--glow)}
.key.ac{color:var(--coral)}
#sdot{width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.45;border:0;padding:0;cursor:pointer}
@media(max-height:640px){.key{height:42px}.pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#sdot{display:none!important}
#nb{position:relative}
#nbd{position:absolute;top:6px;right:7px;width:11px;height:11px;border-radius:50%;background:#FF2D55;border:2px solid var(--bub);animation:ping 1.6s infinite}
#onbar{padding:6px 14px;font-size:.78rem;color:var(--mute);display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);background:var(--bar);position:relative;z-index:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ond{flex:none;width:8px;height:8px;border-radius:50%;background:#2EE59D}
#setd{max-height:86vh;overflow-y:auto}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:.92rem}
.srow input[type=checkbox]{width:42px;height:24px;accent-color:var(--acc);cursor:pointer}
.srow input[type=range]{width:120px;accent-color:var(--acc)}
.srow .btn{padding:7px 12px;font-size:.8rem;border-radius:12px}
.fcard{width:100%;min-height:170px;border-radius:24px;background:var(--bub);border:1px solid var(--line);padding:20px;cursor:pointer;display:grid;place-content:center;text-align:center;line-height:1.5;box-shadow:0 10px 26px rgba(60,50,160,.14)}
.fcard h4{font-family:'Bricolage Grotesque',sans-serif;font-size:1.4rem}
.fcard ul{text-align:left;padding-left:18px}
.toast{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;background:var(--grad);color:#fff;font-weight:800;padding:11px 22px;border-radius:22px;box-shadow:var(--glow);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
html.noanim *{animation:none!important;transition:none!important}

#msgs{background-image:radial-gradient(rgba(127,127,170,.14) 1px,transparent 1px);background-size:22px 22px}
#onbar{padding:8px 14px;gap:12px;overflow-x:auto;text-overflow:clip}
.oav{position:relative;flex:none;width:52px;text-align:center;font-size:.68rem;color:var(--mute);cursor:pointer}
.oav b{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 3px;border-radius:50%;color:#fff;font-size:1.05rem;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #2EE59D}
.oav span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#typing{padding:2px 18px 6px;font-size:.8rem;color:var(--mute);font-weight:700;position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.tdots i{display:inline-block;width:5px;height:5px;margin:0 1px;border-radius:50%;background:var(--acc);animation:tdot 1s infinite}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.pimg{display:block;max-width:100%;max-height:260px;border-radius:14px;margin-bottom:4px;cursor:pointer}
.heart{position:fixed;font-size:3.5rem;pointer-events:none;z-index:99;animation:hb .8s ease forwards}
@keyframes hb{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}60%{transform:translate(-50%,-90%) scale(1.3)}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
#ssearch{width:100%}
details.sn .btn{margin:0 0 12px}
.delic{width:58px;height:58px;border-radius:50%;background:rgba(255,92,138,.18);color:var(--coral);display:grid;place-items:center;margin:0 auto 12px}
.delic .i{width:26px;height:26px}
.dprev{background:var(--bub);border:1px solid var(--line);border-left:3px solid var(--coral);border-radius:12px;padding:8px 12px;text-align:left;font-size:.9rem;color:var(--ink)!important;margin:10px 0 12px}
.dbtns{display:flex;gap:10px;margin-top:16px}
.dbtns .btn{flex:1;padding:12px 10px}
.btn.ghost{background:var(--bub);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(135deg,#FF5C8A,#FF2D55);box-shadow:0 8px 24px rgba(255,45,85,.4)}

/* ===== Phone fixes ===== */
html{-webkit-text-size-adjust:100%}
.brand,.brand>div,.top small{min-width:0}
.top{flex-wrap:wrap}
.brand{flex:1 1 150px}
.top h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{flex:0 0 auto;justify-content:flex-end}
#msgs>*{flex-shrink:0}
#onbar,#typing,#rbar,#emo,.bar,.tabs,#ctabs,.top{flex:none}
.m{max-width:min(82%,560px)}
@media(hover:none){.card::after,.chat::after{display:none}}
@media(max-width:799px){
  body{position:fixed;top:0;left:0;right:0;width:100%;height:var(--vh,100dvh)}
  .chat,.join{height:var(--vh,100dvh)}
  .aurora i{animation:none;filter:blur(60px)}
  .kb .top,.kb #onbar{display:none}
}
@media(max-width:560px){
  .top{padding:10px 12px;gap:8px}
  .top h2{font-size:1.1rem}
  .logo{width:36px;height:36px;border-radius:12px}
  .ic{width:36px;height:36px;border-radius:12px}
  .tools{gap:5px}
  #chat .tools #snd,#chat .tools #thm,#chat .tools #out{display:none}
  #scount,#study .top small{display:none}
  .oav{width:44px}.oav b{width:34px;height:34px;font-size:.9rem;margin-bottom:2px}
  #onbar{padding:6px 12px}
  .sbody{padding:14px 12px}
}

/* ===== Chat tabs / Groups / Private / Conversation ===== */
.tabs button{position:relative}
.rdot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:#FF2D55;border:2px solid var(--bar);animation:ping 1.6s infinite}
#vAll{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.pn{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
#ctabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bar);position:relative;z-index:1}
#ctabs button{flex:1;position:relative;padding:9px 6px;border-radius:14px;border:0;background:transparent;color:var(--mute);font-weight:700;cursor:pointer;transition:all .25s}
#ctabs button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
#ctabs .rdot{top:3px;right:10px}
.chat.incv .top,.chat.incv #ctabs{display:none}
.dmt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bar);flex:none}
.cvh{flex:1;min-width:0;display:flex;flex-direction:column}
.cvh b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvh small{color:var(--mute);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvact{opacity:1;font-weight:700;font-size:.85rem;text-decoration:underline;flex:none}
.dmb{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.dmb>*{flex-shrink:0}
.dmlist{display:flex;flex-direction:column;gap:8px}
.dmi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--bub);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);width:100%;font:inherit}
.dmi:hover{border-color:var(--acc)}
.dmi .av{cursor:inherit}
.dmi .tx2{flex:1;min-width:0}
.dmi .tx2 b,.dmi>b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmi small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmi .nn{background:#FF2D55;color:#fff;border-radius:12px;font-size:.7rem;font-weight:800;padding:2px 9px;flex:none}
.dmi input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--acc)}
.gav .i{width:18px;height:18px}
#cvForm{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bar);flex:none}
#cvForm input#cvIn{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:13px 18px;border:1px solid var(--line);border-radius:26px;background:var(--bub);color:var(--ink)}
#cvForm input#cvIn:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px rgba(109,91,255,.22)}
#cvForm .ic{border-radius:50%;width:44px;height:44px}
.dbtns{display:flex;gap:10px;margin-top:6px}
.dbtns .btn{flex:1;padding:12px 10px}

/* ---- phone speed + game controls ---- */
button,.gt,.mc,.hole,.gopts button,.gttt button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#gstage{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad{margin-top:6px}
@media(hover:none),(pointer:coarse){
  .chat,.card,dialog,dialog::backdrop{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  :root{--panel:rgba(255,255,255,.94)}
  [data-theme="dark"]{--panel:rgba(16,20,56,.96)}
  .aurora{display:none}
  *{scroll-behavior:auto}
  .pad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px}
  .pad button{font-size:1.3rem}
}
</style>
</head>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<section class="join" id="join" hidden>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="card">
    <div class="logo"><svg class="i"><use href="#i-chat"/></svg></div>
    <h1>Ki haal chal mittar ?</h1>
    <p class="sub"> Apna naam aur password dalo (odered by Shanu).</p>
    <form id="authForm">
      <label class="field"><svg class="i"><use href="#i-user"/></svg>
        <input id="nameIn" maxlength="15" placeholder="Tumhara naam (a-z, 0-9, _)" aria-label="Tumhara naam" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="field"><svg class="i"><use href="#i-lock"/></svg>
        <input id="pwIn" type="password" placeholder="Password (kam se kam 6 akshar)" aria-label="Password" required minlength="6" autocomplete="current-password"></label>
      <label class="field ta" id="bioWrap" hidden><svg class="i"><use href="#i-pen"/></svg>
        <textarea id="bioIn" maxlength="150" rows="3" placeholder="Apne baare mein 2 line likho (dost tumhe isse pehchanenge)" aria-label="Apne baare mein"></textarea></label>
      <button class="btn" type="submit" id="goBtn">Login</button>
      <button class="link" type="button" id="swap">Naye ho? Account banao</button>
    </form>
    <p id="authErr" role="alert"></p>
  </div>
</section>

<!-- Chat: sirf calculator mein 2026 likhne par khulti hai -->
<section class="chat" id="chat" hidden>
  <div class="top">
    <div class="brand">
      <button class="logo" id="logoBtn" type="button" aria-label="StudyDesk par wapas"><svg class="i"><use href="#i-chat"/></svg></button>
      <div><h2>Dosto ka Adda</h2><small><span class="live-dot"></span><span id="who"></span></small></div>
    </div>
    <div class="tools">
      <button class="ic" id="sd" title="Wapas StudyDesk (Esc)" aria-label="Wapas StudyDesk"><svg class="i"><use href="#i-book"/></svg></button>
      <button class="ic" id="snd" title="Awaaz on/off" aria-label="Awaaz on ya off"><svg class="i"><use href="#i-bell"/></svg></button>
      <button class="ic" id="thm" title="Dark ya light" aria-label="Dark ya light mode"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="ic" id="me" title="Mera profile" aria-label="Mera profile"><svg class="i"><use href="#i-user"/></svg></button>
      <button class="ic" id="out" title="Logout" aria-label="Logout"><svg class="i"><use href="#i-logout"/></svg></button>
    </div>
  </div>
  <div id="ctabs" role="tablist">
    <button type="button" class="on" data-v="all">All chat<i class="rdot" hidden></i></button>
    <button type="button" data-v="grp">Groups<i class="rdot" hidden></i></button>
    <button type="button" data-v="dm">Private<i class="rdot" hidden></i></button>
  </div>

  <!-- 1) All chat (sab dost) -->
  <div id="vAll">
    <div id="msgs" aria-live="polite"></div>
    <button id="jump" hidden><svg class="i sm"><use href="#i-down"/></svg>Naye messages</button>
    <div id="rbar" hidden><span id="rtxt"></span><button class="ab" id="rx" type="button" aria-label="Reply hatao"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div id="emo" hidden></div>
    <form class="bar" id="sendForm">
      <button class="ic" type="button" id="emoBtn" aria-label="Emoji chuno"><svg class="i"><use href="#i-smile"/></svg></button>
      <input id="msgIn" maxlength="500" autocomplete="off" placeholder="Message likho..." aria-label="Message likho">
      <button class="send" type="submit" id="sendBtn" aria-label="Bhejo"><svg class="i"><use href="#i-send"/></svg></button>
    </form>
  </div>

  <!-- 2) Groups -->
  <div class="pn" id="gp" hidden>
    <div class="dmb" id="gpHome">
      <button class="btn" id="gpNewBtn" type="button">＋ Naya group banao</button>
      <div class="dmlist" id="gpList"></div>
    </div>
    <div class="dmb" id="gpNew" hidden>
      <label class="field"><input id="gpName" maxlength="30" placeholder="Group ka naam" aria-label="Group ka naam" autocomplete="off"></label>
      <p class="shead">Dost chuno (kam se kam 1)</p>
      <div class="dmlist" id="gpPick"></div>
      <div class="dbtns"><button class="btn ghost" id="gpCancel" type="button">Cancel</button><button class="btn" id="gpMake" type="button">Group banao</button></div>
    </div>
  </div>

  <!-- 3) Private (1-to-1) -->
  <div class="pn" id="dm" hidden>
    <div class="dmb" id="dmHome">
      <label class="field"><input id="dmSearch" placeholder="Dost ka naam dhundo..." aria-label="Dost dhundo" autocomplete="off"></label>
      <div class="dmlist" id="dmThreads"></div>
      <p class="shead">Saare dost</p>
      <div class="dmlist" id="dmUsers"></div>
    </div>
  </div>

  <!-- Conversation (group ya private) -->
  <div class="pn" id="cv" hidden>
    <div class="dmt">
      <button class="ic" id="cvBack" type="button" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="cvh"><b id="cvTitle"></b><small id="cvSub"></small></div>
      <button class="ab cvact" id="cvAct" type="button" hidden></button>
    </div>
    <div class="dmb" id="cvMsgs"></div>

function swipe(node, fn, chain){
  let sx = 0, sy = 0, fired = false;
  node.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; fired = false; }, {passive: true});
  node.addEventListener('touchmove', e => {
    if(e.cancelable) e.preventDefault(); if(fired) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
    if(chain){ sx = t.clientX; sy = t.clientY; } else fired = true;
  }, {passive: false});
}

function g2048(st){
  let b, score, over; const info = el('div', 'ginfo'), grid = el('div', 'g48');
  const upd = () => { info.textContent = 'Score ' + score + ' · Best ' + bestGet('2048'); };
  function spawn(){ const e = []; b.forEach((v, i) => { if(!v) e.push(i); }); if(!e.length) return; const i = e[Math.random()*e.length|0]; b[i] = Math.random() < .9 ? 2 : 4; return i; }
  function slide(line){ const a = line.filter(Boolean); let g = 0; for(let i = 0; i < a.length - 1; i++){ if(a[i] === a[i+1]){ a[i] *= 2; g += a[i]; a.splice(i+1, 1); } } while(a.length < 4) a.push(0); return [a, g]; }
  function canMove(){ for(let i = 0; i < 16; i++){ if(!b[i]) return true; if(i % 4 < 3 && b[i] === b[i+1]) return true; if(i < 12 && b[i] === b[i+4]) return true; } return false; }
  function draw(ni){
    grid.innerHTML = '';
    b.forEach((v, i) => { const t = el('div', 'c48' + (i === ni ? ' nw' : ''), v || ''); if(v){ const l = Math.log2(v); t.style.background = 'hsl(' + (255 - l * 17) + ' 72% ' + (62 - Math.min(l, 10) * 1.5) + '%)'; if(v >= 1024) t.style.fontSize = 'clamp(.8rem,4vw,1.3rem)'; } grid.appendChild(t); });
    upd();
  }
  function move(k){
    if(over) return; const d = {l:0, u:1, r:2, d:3}[k]; let moved = false;
    for(let r = 0; r < 4; r++){
      const idx = [0,1,2,3].map(j => d === 0 ? r*4 + j : d === 2 ? r*4 + 3 - j : d === 1 ? j*4 + r : (3 - j)*4 + r);
      const [n, g] = slide(idx.map(i => b[i])); idx.forEach((i, j) => { if(b[i] !== n[j]){ moved = true; b[i] = n[j]; } }); score += g;
    }
    if(moved){ bestSet('2048', score); const ni = spawn(); draw(ni); if(!canMove()){ over = true; info.textContent = 'Game over · Score ' + score; } }
  }
  function init(){ b = Array(16).fill(0); score = 0; over = false; spawn(); spawn(); draw(); }
  const kd = e => { const k = KEYDIR[e.key.toLowerCase()]; if(k){ e.preventDefault(); move(k); } };
  document.addEventListener('keydown', kd); swipe(grid, move);
  const rb = el('button', 'btn sm2', 'New game'); rb.type = 'button'; rb.onclick = init;
  st.append(info, grid, el('p', 'ghint', 'Swipe or use arrow keys. Merge equal tiles to reach 2048.'), rb); init();
  return () => document.removeEventListener('keydown', kd);
}

function calc(ex){
  let s = ex.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  const chk = s.replace(/sin|cos|tan|log|ln|sqrt|π|e/g, '1');
  if(!/^[0-9+\-*/().^% ]*$/.test(chk)) throw new Error('bad');
  s = s.replace(/π/g, 'PI').replace(/e/g, 'E').replace(/\^/g, '**').replace(/%/g, '/100');
  const k = deg ? Math.PI / 180 : 1;
  const r = Function('sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'PI', 'E', '"use strict";return (' + s + ')')(
    x => Math.sin(x * k), x => Math.cos(x * k), x => Math.tan(x * k), Math.log10, Math.log, Math.sqrt, Math.PI, Math.E);
  if(typeof r !== 'number' || !isFinite(r)) throw new Error('bad');
  return String(+r.toPrecision(12));
}

function tone(seq, type, v){
  if(!soundOn) return;
  try{
    ax2 = ax2 || new (window.AudioContext || window.webkitAudioContext)(); let t = ax2.currentTime;
    seq.forEach(([f,d]) => { const o = ax2.createOscillator(), g = ax2.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v*SET.vol, t); g.gain.exponentialRampToValueAtTime(.001, t+d); o.connect(g); g.connect(ax2.destination); o.start(t); o.stop(t+d); t += d*.8; });
  }catch(e){}
}

  const need = () => 3 + lv*2, stop = () => { clearInterval(tm); tm = null; }, sched = () => { stop(); tm = setInterval(tick, Math.max(55, 135 - lv*9)); };
  const upd = () => info.textContent = 'Level ' + lv + ' · Food ' + eat + '/' + need() + ' · Best Lv ' + bestGet('snakeL');
  const at = (a,p) => a.some(s => s.x === p.x && s.y === p.y), rnd = () => ({x:Math.random()*N|0, y:Math.random()*N|0});
  function place(){ do{ food = rnd(); }while(at(sn,food) || at(walls,food)); }

    for(let i = 0; i < Math.min(18,(lv-1)*2); i++){ let w; do{ w = rnd(); }while((w.y >= 9 && w.y <= 11) || at(walls,w)); walls.push(w); }

    dir = nd; const h = {x:(sn[0].x+dir.x+N)%N, y:(sn[0].y+dir.y+N)%N}, ate = h.x === food.x && h.y === food.y;

function flappy2(st){
  const W = 320, H = 480, dpr = Math.min(2, window.devicePixelRatio || 1), cv = el('canvas','gcv');
  cv.width = W*dpr; cv.height = H*dpr; cv.style.aspectRatio = '2/3'; cv.style.width = 'min(84vw,44vh,300px)';
  const c = cv.getContext('2d'), info = el('div','ginfo'); c.setTransform(dpr,0,0,dpr,0,0);
  let y, vy, pipes, fr, score, state, lv, raf = 0, last = 0, acc = 0, gx = 0;
  const gap = () => Math.max(100, 160 - lv*8), spd = () => Math.min(3.6, 2.1 + lv*.2);
  const upd = () => info.textContent = 'Level ' + lv + ' · Score ' + score + ' · Best ' + bestGet('flappy');
  function reset(){ y = 220; vy = 0; pipes = []; fr = 0; score = 0; lv = 1; state = 'idle'; upd(); }
  function flap(){ if(state === 'over'){ reset(); } state = 'run'; vy = -6.4; sfx('click'); }
  function die(){ if(state === 'over') return; state = 'over'; bestSet('flappy', score); sfx('over'); upd(); }
  function step(){
    gx = (gx + spd()) % 24;
    if(state === 'idle'){ y = 220 + Math.sin(performance.now()/260)*8; return; }
    if(state !== 'run') return; vy = Math.min(vy + .38, 9); y += vy; fr++;
    if(!pipes.length || pipes[pipes.length-1].x < W - 190){ const h = gap(); pipes.push({x:W, h, g:60 + Math.random()*(H - 150 - h), p:false}); }
    pipes.forEach(p => { p.x -= spd(); if(!p.p && p.x + 52 < 80){ p.p = true; score++; if(score % 5 === 0){ lv++; sfx('lvl'); toast('Level ' + lv + ' 🎉'); addXP(5); } else sfx('good'); upd(); } });
    pipes = pipes.filter(p => p.x > -60);
    for(const p of pipes) if(88 > p.x && 72 < p.x + 52 && (y - 10 < p.g || y + 10 > p.g + p.h)) die();
    if(y > H - 44 || y < -20) die();
  }
  function pipe(x, top, bot){
    const g = c.createLinearGradient(x,0,x+52,0); g.addColorStop(0,'#16a085'); g.addColorStop(.5,'#2ee6b8'); g.addColorStop(1,'#128f74'); c.fillStyle = g;
    c.fillRect(x+4, 0, 44, top-14); c.fillRect(x, top-14, 52, 14);
    c.fillRect(x+4, bot+14, 44, H); c.fillRect(x, bot, 52, 14);
  }
  function bird(){
    c.save(); c.translate(80, y); c.rotate(Math.max(-.5, Math.min(1.1, vy*.07)));
    c.fillStyle = '#FFD84D'; c.beginPath(); c.ellipse(0,0,16,12,0,0,6.283); c.fill();           // body
    c.fillStyle = '#FFB020'; c.beginPath(); c.ellipse(-4,3,8,5,(state === 'run' && vy < 0) ? -.7 : .4,0,6.283); c.fill(); // wing
    c.fillStyle = '#fff'; c.beginPath(); c.arc(8,-4,5,0,6.283); c.fill();                       // eye
    c.fillStyle = '#111'; c.beginPath(); c.arc(9.5,-4,2.3,0,6.283); c.fill();
    c.fillStyle = '#FF6B3D'; c.beginPath(); c.moveTo(13,0); c.lineTo(23,3); c.lineTo(13,7); c.closePath(); c.fill(); // beak
    c.restore();
  }
  function draw(){
    const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1b1f6b'); g.addColorStop(1,'#6a3fd1'); c.fillStyle = g; c.fillRect(0,0,W,H);
    pipes.forEach(p => pipe(p.x, p.g, p.g + p.h));
    c.fillStyle = '#3b2a8f'; c.fillRect(0, H-44, W, 44); c.fillStyle = '#5a45c4'; for(let x = -gx; x < W; x += 24) c.fillRect(x, H-44, 12, 6);
    bird();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '800 40px Bricolage Grotesque, sans-serif'; c.fillText(score,160,60);
    if(state !== 'run'){ c.fillStyle = 'rgba(8,10,35,.45)'; c.fillRect(0,0,W,H); c.fillStyle = '#fff'; c.font = '800 30px Bricolage Grotesque, sans-serif';
      c.fillText(state === 'over' ? 'Game Over' : 'Flappy Bird', 160, 150); c.font = '500 16px DM Sans, sans-serif'; c.fillText(state === 'over' ? 'Level ' + lv + ' · tap to retry' : 'Tap to flap', 160, 180); }
  }
  function loop(t){ raf = requestAnimationFrame(loop); const dt = Math.min(50, t - (last || t)); last = t; acc += dt; while(acc >= 16.667){ step(); acc -= 16.667; } draw(); }
  const kd = e => { if(e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); flap(); } };
  document.addEventListener('keydown', kd); cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  st.append(info, cv, el('p','ghint','Tap karke bird ko udao. Har 5 points par level up.')); reset(); raf = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', kd); };
}

function ttt2(st){
  const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]], sc = {w:0,l:0,d:0}, info = el('div','ginfo'), grid = el('div','gttt'); let b, over, lv = lvGet('ttt');
  const win = bd => { for(const [x,y,z] of L) if(bd[x] && bd[x] === bd[y] && bd[y] === bd[z]) return bd[x]; return bd.includes('') ? null : 'D'; };
  function mm(bd, turn){ const w = win(bd); if(w === 'O') return 1; if(w === 'X') return -1; if(w === 'D') return 0; let best = turn === 'O' ? -2 : 2;
    for(let i = 0; i < 9; i++) if(!bd[i]){ bd[i] = turn; const s = mm(bd, turn === 'O' ? 'X' : 'O'); bd[i] = ''; best = turn === 'O' ? Math.max(best,s) : Math.min(best,s); } return best; }
  function ai(){ const free = []; b.forEach((v,i) => { if(!v) free.push(i); }); if(Math.random() < Math.max(0, .5 - lv*.08)) return free[Math.random()*free.length|0];

  const upd = () => info.textContent = 'Level ' + lv + ' · You ' + sc.w + ' · Draw ' + sc.d + ' · CPU ' + sc.l;
  function draw(){ grid.innerHTML = ''; b.forEach((v,i) => { const t = el('button', v === 'O' ? 'o' : '', v); t.type = 'button'; t.onclick = () => play(i); grid.appendChild(t); }); }

  function play(i){ if(over || b[i]) return; b[i] = 'X'; sfx('click'); let r = win(b); if(!r){ b[ai()] = 'O'; r = win(b); } draw(); if(r) end(r); }

function math2(st){

  const goal = () => 5 + lv*2, r = n => Math.floor(Math.random()*n), upd = () => info.textContent = 'Level ' + lv + ' · Time ' + t + 's · ' + score + '/' + goal();
